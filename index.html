<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links - Scooby Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="profile-wrapper">
            <img src="Scooby_Doo.png" alt="Profile" class="profile-img">
            <div class="status-badge"></div>
        </div>
        
        <h1 class="name">Scooby Doo</h1>
        <p class="bio">Minecraft Developer | Plugin Creator</p>

        <div class="links">
            <a href="https://instagram.com/ใส่ชื่อยูสเซอร์" class="link-btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            
            <a href="https://discord.gg/ใส่ลิงก์ดิสคอร์ด" class="link-btn" target="_blank">
                <i class="fab fa-discord"></i> Discord
            </a>
            
            <a href="https://youtube.com/@ใส่ชื่อช่อง" class="link-btn" target="_blank">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            
            <a href="https://tiktok.com/@ใส่ชื่อยูสเซอร์" class="link-btn" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>

            <a href="https://ใส่ลิงก์เว็บเช่าคอมของคุณ" class="link-btn" target="_blank">
                <i class="fas fa-desktop"></i> เว็บเช่าคอมออนไลน์
            </a>
        </div>

        <div class="social-footer">
            <p>© 2024 Scooby Doo Theme</p>
        </div>
    </div>

</body>
</html>
